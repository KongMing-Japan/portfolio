name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/prices.json"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch: {}

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare credentials
        id: cloudflare-credentials
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Cloudflare credentials are not complete. Set CLOUDFLARE_API_TOKEN in GitHub Secrets to enable deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cloudflare-credentials.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.cloudflare-credentials.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.cloudflare-credentials.outputs.ready == 'true'
      - run: npm test
        if: steps.cloudflare-credentials.outputs.ready == 'true'
      - run: npm run build
        if: steps.cloudflare-credentials.outputs.ready == 'true'
      - run: npx wrangler pages deploy dist --project-name=portfolio --branch=main
        if: steps.cloudflare-credentials.outputs.ready == 'true'
